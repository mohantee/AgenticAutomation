# Harness CD Pipeline — AgenticAutomation
# Deploy to ECS (Fargate)
#
# Prerequisites:
#   - Connectors: aws_connector
#   - Environment: test (with infra def: ecs_fargate_mumbai)
#   - Service: agenticautomation
#
# Note: CI (Build, Test, Push to ECR) runs via GitHub Actions (.github/workflows/ci.yml).

pipeline:
  name: agenticautomation-deploy
  identifier: agenticautomation_deploy
  projectIdentifier: AgenticAutomation
  orgIdentifier: default
  tags: {}

  variables:
    - name: IMAGE_TAG
      type: String
      description: "Docker image tag from ECR to deploy"
      required: false
      value: <+input>.default(latest)

  stages:
    # ──────────────────────────────────────────────
    # CD Stage: Deploy to ECS Fargate
    # ──────────────────────────────────────────────
    - stage:
        name: Deploy to ECS
        identifier: deploy_to_ecs
        type: Deployment
        spec:
          deploymentType: ECS
          service:
            serviceRef: agenticautomation
          environment:
            environmentRef: test
            deployToAll: false
            infrastructureDefinitions:
              - identifier: ecs_fargate_mumbai
          execution:
            steps:
              - step:
                  type: EcsRollingDeploy
                  name: ECS Rolling Deploy
                  identifier: ecs_rolling_deploy
                  spec: {}
                  timeout: 10m
            rollbackSteps:
              - step:
                  type: EcsRollingRollback
                  name: ECS Rolling Rollback
                  identifier: ecs_rolling_rollback
                  spec: {}
                  timeout: 10m
        tags: {}
        failureStrategies:
          - onFailure:
              errors:
                - AllErrors
              action:
                type: StageRollback
